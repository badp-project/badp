url: https://badp-project.github.io/badp/

template:
  bootstrap: 5
  bslib:
    primary: "#1a7abf"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem

home:
  title: "badp - Bayesian Averaging for Dynamic Panels"
  description: >
    R package implementing Bayesian model averaging for dynamic panels
    with weakly exogenous regressors.
  sidebar:
    structure: [links, license, community, citation, authors, dev]
    components:
      links:
        title: Links
        text: |
          - [View on CRAN](https://CRAN.R-project.org/package=badp)
          - [Browse source code](https://github.com/badp-project/badp)
          - [Report a bug](https://github.com/badp-project/badp/issues)

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fa-github
      href: https://github.com/badp-project/badp
      aria-label: GitHub

reference:
  - title: "Data Preparation"
    desc: >
      Bringing panel data into the form the estimation functions expect.
      Standardization is always needed; merging a lagged column is needed only
      for source data that store the dependent variable twice.
    contents:
      - feature_standardization
      - join_lagged_col

  - title: "Model Space Estimation"
    desc: >
      Estimating every model in the space by maximum likelihood, and the
      statistics computed from the fitted parameters.
    contents:
      - optim_model_space
      - optim_model_space_params
      - compute_model_space_stats

  - title: "SEM Likelihood"
    desc: >
      The structural equation model likelihood, for fitting or inspecting a
      single model.
    contents:
      - sem_likelihood

  - title: "Bayesian Model Averaging"
    desc: >
      Averaging over the model space, the most probable individual models, and
      the jointness measures between regressors.
    contents:
      - bma
      - best_models
      - jointness

  - title: "Extracting Results"
    desc: >
      Accessors returning the quantities of interest from a fitted object,
      without requiring any knowledge of how it is stored internally.
    contents:
      - bma_table
      - pip
      - pmp
      - model_size_table
      - regressors
      - n_models
      - weighting
      - convergence

  - title: "Visualization"
    desc: "Plot collections summarizing the model space and the coefficients."
    contents:
      - model_sizes
      - model_pmp
      - coef_hist
      - posterior_dens

  - title: "Methods"
    desc: >
      Methods for the classes the package returns. Each is also reached by
      calling the generic on the object.
    contents:
      - print.badp_model_space
      - summary.badp_model_space
      - print.summary.badp_model_space
      - print.badp_bma
      - summary.badp_bma
      - print.summary.badp_bma
      - coef.badp_bma
      - plot.badp_bma
      - print.badp_bma_coef
      - print.badp_best_models
      - summary.badp_best_models
      - print.summary.badp_best_models
      - plot.badp_best_models
      - "[.badp_best_models"
      - print.badp_model
      - summary.badp_model
      - print.summary.badp_model
      - coef.badp_model
      - print.badp_plots

  - title: "Datasets"
    desc: "Bundled example datasets and pre-computed model spaces."
    contents:
      - economic_growth
      - original_economic_growth
      - migration_data
      - small_model_space
      - full_model_space
      - full_bma_results
      - model_space_nonnested
      - migration_model_space
      - migration_model_space_nonnested

footer:
  structure:
    left: developed_by
    right: built_with
